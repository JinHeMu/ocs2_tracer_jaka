# controllers.yaml
# tracer_jaka_zu5 移动机械臂的 ros2_control 控制器配置
controller_manager:
  ros__parameters:
    update_rate: 200          # 必须 <= MuJoCo 1/timestep = 500Hz，留余量取 200
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    base_controller:
      type: diff_drive_controller/DiffDriveController

# ===================== 机械臂 =====================
arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.0

# ===================== 差速底盘 =====================
base_controller:
  ros__parameters:
    left_wheel_names:  ["left_wheel"]
    right_wheel_names: ["right_wheel"]

    wheel_separation: 0.34
    wheel_radius: 0.065

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint

    open_loop: false
    position_feedback: false
    publish_limited_velocity: true
    enable_odom_tf: true

    use_stamped_vel: true

    linear:
      x:
        has_velocity_limits: true
        has_acceleration_limits: true
        max_velocity: 0.05
        min_velocity: -0.05
        max_acceleration: 0.2
        min_acceleration: -0.2

    angular:
      z:
        has_velocity_limits: true
        has_acceleration_limits: true
        max_velocity: 0.05
        min_velocity: -0.05
        max_acceleration: 0.2
        min_acceleration: -0.2
